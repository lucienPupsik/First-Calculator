<!DOCTYPE html>

<html lang="en">

<head>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taschenrechner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="manifest" href="manifest.json">
</head>


<body>

    <div id="resultArea"></div>
    

      


    <table>
        <tr>

            <td class="highlight" onclick="appendOperation('(')">(</td>
            <td class="highlight" onclick="appendOperation(')')">)</td>
            <td id="Clear" onclick="clearResult()">Clear</td>
            <td id="DELETE" onclick="deleteLast()">DEL</td>
        
        </tr>
        
        <tr>
            <td id="Nummern" onclick="appendOperation(7)">7</td>
            <td id="Nummern" onclick="appendOperation(8)">8</td>
            <td id="Nummern" onclick="appendOperation(9)">9</td>
            <td id="result" onclick="calculateResult()">=</td>
        </tr>
        <tr>
            <td id="Nummern" onclick="appendOperation(4)">4</td>
            <td id="Nummern" onclick="appendOperation(5)">5</td>
            <td id="Nummern" onclick="appendOperation(6)">6</td>
            <td class="highlight" onclick="appendOperation(' - ')">-</td>

        </tr>
        <tr>
            <td id="Nummern" onclick="appendOperation(1)">1</td>
            <td id="Nummern" onclick="appendOperation(2)">2</td>
            <td id="Nummern" onclick="appendOperation(3)">3</td>
            <td class="highlight" onclick="appendOperation(' + ')">+</td>
        </tr>
        <tr>
            <td class="highlight" onclick="appendOperation('.')">.</td>
            <td id="Nummern" onclick="appendOperation(0)">0</td>
            <td class="highlight" onclick="appendOperation(' / ')">:</td>
            <td class="highlight" onclick="appendOperation(' * ')">X</td>

        </tr>
    </table>
</body>

</html>
